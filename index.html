<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo de Cálculo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--ink:#14213d;--mute:#51607a;--card:#fff;--line:#c9d6e4;--acc:#1d5f8f;--acc-ink:#fff;--hi:#fff1c2;--hi-ink:#4a3600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--ink:#e6edf7;--mute:#9db0cc;--card:#16233a;--line:#2b3e5d;--acc:#6bb3e6;--acc-ink:#0b1626;--hi:#4a3d12;--hi-ink:#ffe9a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1826;--ink:#e6edf7;--mute:#9db0cc;--card:#16233a;--line:#2b3e5d;--acc:#6bb3e6;--acc-ink:#0b1626;--hi:#4a3d12;--hi-ink:#ffe9a3;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Serif 4",Georgia,serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:var(--acc)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:310px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 40px;font:500 .93rem "Bricolage Grotesque",system-ui,sans-serif}
.mainc{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;font:600 1rem "Bricolage Grotesque",system-ui,sans-serif}
.top a{text-decoration:none;color:var(--ink);flex:1}
#mb{display:none;font-size:1.3rem;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
#tp{font-weight:500;font-size:.85rem;color:var(--mute)}
@media(max-width:900px){#mb{display:inline-block}.side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:40;transform:translateX(-105%);transition:transform .2s;width:min(330px,88vw)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}}
main{max-width:840px;margin:0 auto;padding:18px 16px 80px}
.nl{display:block;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.nl:hover,.tl:hover{background:var(--bg)}
.sub{font-size:.74rem;letter-spacing:.06em;color:var(--mute);margin:14px 8px 4px}
.side details{border-top:1px solid var(--line)}
.side summary{cursor:pointer;padding:8px 6px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.pc{color:var(--mute);font-weight:500;font-size:.8rem}
.as{display:block;padding:5px 8px;margin-top:4px;font-size:.78rem;letter-spacing:.04em;color:var(--mute);text-decoration:none;text-transform:uppercase}
.tl{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;line-height:1.3}
.tl.on{background:var(--hi);color:var(--hi-ink)}
.tl.pl{opacity:.55}
.tl em,.pill{font:600 .68rem "Bricolage Grotesque",system-ui,sans-serif;font-style:normal;background:var(--hi);color:var(--hi-ink);padding:1px 7px;border-radius:99px;margin-left:4px;white-space:nowrap}
.dot{flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--mute);margin-top:4px}
.d1{background:#e0a800;border-color:#e0a800}.d2{background:#2a9d57;border-color:#2a9d57}
h2{font:700 1.65rem/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.01em}
h3{font:700 1.05rem "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.bc{font:500 .88rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--mute);margin:0 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.cat{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;text-decoration:none;color:var(--ink)}
.cat .n{flex:none;background:var(--acc);color:var(--acc-ink);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .95rem "Bricolage Grotesque",system-ui,sans-serif}
.cat>span:last-child{flex:1;min-width:0}
.cat b{display:block;font:700 1.02rem "Bricolage Grotesque",system-ui,sans-serif}
.cat small{color:var(--mute);font-size:.86rem;line-height:1.3;display:block}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.f{background:var(--card);border-left:4px solid var(--acc);border-radius:6px;padding:8px 14px;margin:0 0 8px}
.f b{display:block;font-size:1.12rem;font-weight:600}
.f small{color:var(--mute);font-size:.9rem;display:block}
.big{background:var(--hi);color:var(--hi-ink);border-radius:10px;padding:12px 16px;margin:0 0 8px;font-size:1.25rem;font-weight:600}
.stp{display:flex;gap:6px;overflow-x:auto;margin:12px 0 14px;padding-bottom:4px}
.stp button{flex:none;font:500 .85rem "Bricolage Grotesque",system-ui,sans-serif;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.stp button[aria-current="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
label{display:flex;flex-direction:column;gap:3px;font:500 .82rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--mute);flex:1 1 90px}
label.w{flex:1 1 100%}
input,select{font:16px "Source Serif 4",Georgia,serif;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.pal button{font:500 .9rem "Bricolage Grotesque",system-ui,sans-serif;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.out{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
ol.steps{margin:6px 0 10px;padding-left:22px}
ol.steps li{margin:5px 0}
ul.pl{margin:0;padding-left:20px}
ul.pl li{margin:5px 0}
.res{display:inline-block;background:var(--hi);color:var(--hi-ink);padding:5px 12px;border-radius:6px;font-size:1.1rem;font-weight:600;margin:2px 0 6px}
.txt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.err{color:#c0392b;margin:6px 0}
.okb,.nok{border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid}
.okb{background:rgba(40,160,80,.15);border-color:#2a9d57}
.nok{background:rgba(210,60,60,.14);border-color:#d23c3c}
.btn{font:500 .95rem "Bricolage Grotesque",system-ui,sans-serif;padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pn{display:flex;gap:10px;margin-top:22px}
.pn button,.pn a{flex:1;text-align:center}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;font:500 1rem "Bricolage Grotesque",system-ui,sans-serif;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{background:rgba(40,160,80,.22);border-color:#2a9d57}
.opt.bad{background:rgba(210,60,60,.2);border-color:#d23c3c}
.q{font-size:1.1rem;margin:4px 0 8px}
table.tb{border-collapse:collapse;font-size:.88rem;margin:6px 0;width:auto}
.tb th,.tb td{border:1px solid var(--line);padding:4px 8px;text-align:right}
table.tb.l th,table.tb.l td{text-align:left}
.gr svg{width:100%;max-width:480px;display:block;touch-action:none;background:var(--card);border:1px solid var(--line);border-radius:8px;cursor:grab;margin:8px 0 4px}
.gc{display:flex;gap:6px;flex-wrap:wrap}
.gc button{font:500 .8rem "Bricolage Grotesque",system-ui,sans-serif;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ro{font-size:.84rem;color:var(--mute);margin:4px 0}
sup,sub{font-size:.7em;line-height:0}
</style>
</head>
<body>
<div class="app">
<aside id="side" class="side" aria-label="Menu de módulos"></aside>
<div class="mainc">
<div class="top"><button id="mb" aria-label="Abrir menu">☰</button><a href="#">Estudo de Cálculo</a><span id="tp"></span></div>
<main id="main"></main>
</div>
</div>
<script>
/* ===== Utilidades ===== */
let NOG=false;
const n=x=>isFinite(x)?String(Math.round(x*1e4)/1e4).replace('.',',').replace('-','−'):'—';
const pr=x=>x<0?'('+n(x)+')':n(x);
const N=s=>{s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');if(s==='e')return Math.E;if(/^-?[\d.]+\/-?[\d.]+$/.test(s)){const[a,b]=s.split('/'),r=a/b;if(!isFinite(r))throw 0;return r}const x=Number(s);if(s===''||isNaN(x))throw 0;return x};
const fmt=s=>s.replace(/\^\(([^)]+)\)/g,"<sup>$1</sup>").replace(/\^(-?[\w.]+)/g,"<sup>$1</sup>");
const ks=p=>Object.keys(p).map(Number).filter(k=>Math.abs(p[k])>1e-12).sort((a,b)=>b-a);
const T=(c,k)=>{const a=Math.abs(c);return k===0?n(a):(a===1?'':n(a))+'x'+(k===1?'':'<sup>'+n(k)+'</sup>')};
const TS=(c,k)=>(c<0?'−':'')+T(c,k);
const TZ=(c,k)=>c===0?'0':TS(c,k);
const P=p=>{const k=ks(p);return k.length?k.map((i,j)=>(j?(p[i]<0?' − ':' + '):(p[i]<0?'−':''))+T(p[i],i)).join(''):'0'};
const parse=s=>{s=s.replace(/\s/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/[*·]/g,'').replace(/√x/g,'x^0.5').replace(/(\d*\.?\d*)\/x(?:\^(\d+))?/g,(m,c,e)=>(c||1)+'x^-'+(e||1));if(!s)return null;const t=s.match(/[+-]?(?:(?<=\^)-|[^+-])+/g);if(!t||t.join('')!==s)return null;const p={};for(const x of t){const m=x.match(/^([+-]?)(\d*\.?\d*)(x(?:\^(-?\d*\.?\d+))?)?$/);if(!m||(m[2]===''&&!m[3]))return null;const c=(m[2]===''?1:+m[2])*(m[1]==='-'?-1:1),k=m[3]?(m[4]!==undefined?+m[4]:1):0;if(isNaN(c)||isNaN(k))return null;p[k]=(p[k]||0)+c}return p};
const der=p=>{const r={};for(const k in p){const e=+k;if(e!==0)r[e-1]=p[k]*e}return r};
const integ=p=>{const r={};for(const k in p){const e=+k;if(Math.abs(e+1)<1e-9)return null;r[e+1]=p[k]/(e+1)}return r};
const add=(p,q)=>{const r={...p};for(const k in q)r[k]=(r[k]||0)+q[k];return r};
const sub=(p,q)=>{const r={...p};for(const k in q)r[k]=(r[k]||0)-q[k];return r};
const mul=(p,q)=>{const r={};for(const a in p)for(const b in q){const k=Math.round((+a+ +b)*1e6)/1e6;r[k]=(r[k]||0)+p[a]*q[b]}return r};
const ev=(p,x)=>Object.keys(p).reduce((s,k)=>s+p[k]*Math.pow(x,k),0);
const R=p=>{const K=ks(p);if(!K.every(Number.isInteger))return null;const d=Math.max(-1,...K);if(d==1)return[-(p[0]||0)/p[1]];if(d==2){const a=p[2],b=p[1]||0,c=p[0]||0,D=b*b-4*a*c;if(D<0)return[];if(D==0)return[-b/(2*a)];const s=Math.sqrt(D);return[(-b+s)/(2*a),(-b-s)/(2*a)].sort((x,y)=>x-y)}return null};
const arr=p=>{const d=Math.max(...ks(p),0),a=[];for(let i=d;i>=0;i--)a.push(p[i]||0);return a};
const fromArr=a=>{const p={};a.forEach((c,i)=>p[a.length-1-i]=c);return p};
const div=(p,r)=>{const a=arr(p),b=[a[0]];for(let i=1;i<a.length-1;i++)b.push(a[i]+r*b[i-1]);return fromArr(b)};
const ol=a=>'<ol class="steps">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
const res=s=>'<span class="res">'+s+'</span>';
const err=s=>'<p class="err">'+s+'</p>';
const BAD=err('Não entendi a expressão. Use algo como 3x^2 − 5x + 7, sem parênteses.');
const cp=t=>NOG?'<div class="txt">'+t+'</div>':'<div class="txt">'+t+'</div><button class="btn alt" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.previousElementSibling.innerText)">Copiar texto</button>';
const rng=xs=>{const lo=Math.min(...xs),hi=Math.max(...xs),sp=Math.max(hi-lo,2);return[lo-.4*sp,hi+.4*sp]};
const tb=(f,xs)=>NOG?'':'<div style="overflow-x:auto"><table class="tb"><tr><th>x</th>'+xs.map(x=>'<td>'+n(x)+'</td>').join('')+'</tr><tr><th>y</th>'+xs.map(x=>'<td>'+n(f(x))+'</td>').join('')+'</tr></table></div>';
const q2=(a,b,c)=>{const D=b*b-4*a*c,xv=-b/(2*a),yv=-D/(4*a);let x=[],s=['Δ = b² − 4ac = '+pr(b)+'² − 4·'+pr(a)+'·'+pr(c)+' = '+n(D)];if(D<0)s.push('Δ < 0: não há raízes reais.');else{const q=Math.sqrt(D);x=D==0?[xv]:[(-b+q)/(2*a),(-b-q)/(2*a)];s.push('x = (−b ± √Δ)/2a = ('+n(-b)+' ± '+n(q)+')/'+n(2*a));s.push(D==0?'Δ = 0: uma única raiz, x = '+n(xv):'x₁ = '+n(x[0])+' e x₂ = '+n(x[1]))}return{D,xv,yv,x,s}};

/* ===== 1º grau ===== */
const g1=(a,b)=>{const r=a==0?null:-b/a;return graph(x=>a*x+b,(r===null?[]:[[r,0]]).concat([[0,b]]),...rng(r===null?[0,1]:[r,0]),{cap:'Reta y = '+P({1:a,0:b})+'. Pontos: raiz e corte com o eixo y.'})+tb(x=>a*x+b,[0,1,2,3,4])};
const cA=v=>{const a=N(v.a),b=N(v.b),x=N(v.x),f=t=>a*t+b;return ol(['Compare com f(x) = ax + b: a = '+n(a)+' (acompanha o x) e b = '+n(b)+' (termo sozinho).','a '+(a>0?'> 0: a reta sobe (função crescente).':a<0?'< 0: a reta desce (função decrescente).':'= 0: reta horizontal.'),'b = '+n(b)+': a reta corta o eixo y em (0; '+n(b)+').','Valor em x = '+n(x)+': f('+n(x)+') = '+n(a)+'·'+pr(x)+' + '+pr(b)+' = '+n(f(x))])+res('f('+n(x)+') = '+n(f(x)))+graph(f,[[0,b],[x,f(x)]],...rng([0,x,a==0?1:-b/a]),{cap:'Reta y = '+P({1:a,0:b})+' com o ponto calculado.'})};
const c1=v=>{const a=N(v.a),b=N(v.b);if(a==0)return err('a precisa ser diferente de 0.');const r=-b/a;return ol(['Iguale a zero: '+P({1:a,0:b})+' = 0','Isole x: x = −b/a = −'+pr(b)+'/'+pr(a)+' = '+n(r),'Como a '+(a>0?'> 0, a função é crescente.':'< 0, a função é decrescente.'),'Sinal: f(x) > 0 para x '+(a>0?'>':'<')+' '+n(r)+' e f(x) < 0 para x '+(a>0?'<':'>')+' '+n(r)+'. Corta o eixo y em '+n(b)+'.'])+res('raiz: x = '+n(r))+g1(a,b)};
const c1b=v=>{const x1=N(v.x1),y1=N(v.y1),x2=N(v.x2),y2=N(v.y2);if(x1==x2)return err('Os valores de x precisam ser diferentes.');const a=(y2-y1)/(x2-x1),b=y1-a*x1;return ol(['a = (y₂ − y₁)/(x₂ − x₁) = ('+pr(y2)+' − '+pr(y1)+')/('+pr(x2)+' − '+pr(x1)+') = '+n(a),'b = y₁ − a·x₁ = '+pr(y1)+' − '+pr(a)+'·'+pr(x1)+' = '+n(b),'Conferência no 2º ponto: '+n(a)+'·'+pr(x2)+' + '+pr(b)+' = '+n(a*x2+b)])+res('f(x) = '+P({1:a,0:b}))+graph(x=>a*x+b,[[x1,y1],[x2,y2]],...rng([x1,x2,0]),{cap:'Reta pelos dois pontos dados.'})};

/* ===== Equação 1º grau ===== */
const c5=v=>{const a=N(v.a),b=N(v.b),c=N(v.c),d=N(v.d);if(a==c)return err('Os termos em x se cancelam (a = c).');const x=(d-b)/(a-c);return ol(['Termos com x para a esquerda e números para a direita: ('+n(a)+' − '+pr(c)+')x = '+n(d)+' − '+pr(b),n(a-c)+'x = '+n(d-b),'x = '+n(d-b)+'/'+n(a-c)+' = '+n(x),'Conferência: '+n(a)+'·'+pr(x)+' + '+pr(b)+' = '+n(a*x+b)+' e '+n(c)+'·'+pr(x)+' + '+pr(d)+' = '+n(c*x+d)])+res('x = '+n(x))+graph(t=>a*t+b,[[x,a*x+b]],...rng([x,0]),{f2:t=>c*t+d,cap:'Cheia: y = ax + b. Tracejada: y = cx + d. Elas se cruzam em x = '+n(x)+'.'})};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),lcm=(a,b)=>a/gcd(a,b)*b;
const one=u=>{const m=u.match(/^(-?\d+)\/(\d+)$/);if(m)return[+m[1],+m[2]];const x=Number(u);if(isNaN(x))throw 0;const d=Math.pow(10,(u.split('.')[1]||'').length);return[Math.round(x*d),d]};
const fr=s=>{s=s.replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-');const t=s.match(/[+-]?[^+-]+/g);if(!t)throw 0;let a=0,b=1;for(const u of t){const[x,y]=one(u),L=lcm(b,y);a=a*L/b+x*L/y;b=L}const g=gcd(a,b)||1;return[a/g,b/g]};
const cFr=v=>{const F=[v.a,v.b,v.c,v.d].map(fr),L=F.reduce((s,f)=>lcm(s,f[1]),1),[A,B,C,D]=F.map(f=>f[0]*L/f[1]);if(A==C)return err('Os termos em x se cancelam.');const x=(D-B)/(A-C),w=F.map(f=>f[0]/f[1]);return ol(['Coeficientes (já somados): '+F.map(f=>f[1]==1?f[0]:f[0]+'/'+f[1]).join(' ; '),'m.m.c. dos denominadores = '+L,'Multiplique os dois lados por '+L+': '+n(A)+'x + '+pr(B)+' = '+n(C)+'x + '+pr(D),'Agrupe: ('+n(A)+' − '+pr(C)+')x = '+n(D)+' − '+pr(B)+' → '+n(A-C)+'x = '+n(D-B),'x = '+n(D-B)+'/'+n(A-C)+' = '+n(x)])+res('x = '+n(x))+graph(t=>w[0]*t+w[1],[[x,w[0]*x+w[1]]],...rng([x,0]),{f2:t=>w[2]*t+w[3],cap:'As duas retas (lado esquerdo e lado direito) se cruzam em x = '+n(x)+'.'})};

/* ===== 2º grau ===== */
const par=(a,b,c,x,extra,cap)=>graph(t=>a*t*t+b*t+c,extra,...rng(x),{cap});
const c2a=v=>{const a=N(v.a),b=N(v.b),c=N(v.c);if(a==0)return err('a precisa ser diferente de 0.');const xv=-b/(2*a),f=t=>a*t*t+b*t+c;return ol(['Compare com ax² + bx + c: a = '+n(a)+', b = '+n(b)+', c = '+n(c)+'.','a '+(a>0?'> 0: concavidade para cima (tem valor mínimo).':'< 0: concavidade para baixo (tem valor máximo).'),'|a| = '+n(Math.abs(a))+': '+(Math.abs(a)>1?'parábola mais fechada.':Math.abs(a)<1?'parábola mais aberta.':'abertura padrão.'),'c = '+n(c)+': a parábola corta o eixo y em (0; '+n(c)+').','O vértice fica em xᵥ = −b/2a = '+n(xv)])+par(a,b,c,[xv,0],[[0,c],[xv,f(xv)]],'Parábola '+P({2:a,1:b,0:c})+'. Pontos: corte com o eixo y e vértice.')};
const c2b=v=>{const a=N(v.a),b=N(v.b),c=N(v.c);if(a==0)return err('a precisa ser diferente de 0.');const q=q2(a,b,c),s=['a = '+n(a)+', b = '+n(b)+', c = '+n(c)].concat(q.s,[q.D>0?'Δ > 0: a parábola corta o eixo x em 2 pontos.':q.D==0?'Δ = 0: a parábola apenas toca o eixo x.':'Δ < 0: a parábola não toca o eixo x.']);return ol(s)+res(q.x.length?'raízes: '+q.x.map(n).join(' e '):'sem raízes reais')+par(a,b,c,q.x.concat([q.xv]),q.x.map(x=>[x,0]),'Os pontos marcados são as raízes (onde y = 0).')};
const c2c=v=>{const a=N(v.a),b=N(v.b),c=N(v.c);if(a==0)return err('a precisa ser diferente de 0.');const q=q2(a,b,c),f=t=>a*t*t+b*t+c,base=Math.round(q.xv),xs=[-3,-2,-1,0,1,2,3].map(i=>base+i);if(!xs.includes(q.xv))xs.push(q.xv);xs.sort((x,y)=>x-y);return ol(['a = '+n(a)+', b = '+n(b)+', c = '+n(c)+'. Como a '+(a>0?'> 0, o vértice é um mínimo.':'< 0, o vértice é um máximo.'),'xᵥ = −b/2a = −'+pr(b)+'/(2·'+pr(a)+') = '+n(q.xv),'Δ = b² − 4ac = '+n(q.D)+' → yᵥ = −Δ/4a = '+n(q.yv)+' (confere com f('+n(q.xv)+') = '+n(f(q.xv))+')','Eixo de simetria: x = '+n(q.xv)+'. Imagem: '+(a>0?'y ≥ ':'y ≤ ')+n(q.yv)])+res('vértice ('+n(q.xv)+'; '+n(q.yv)+') = '+(a>0?'mínimo':'máximo'))+par(a,b,c,q.x.concat([q.xv,0]),[[q.xv,q.yv],[0,c]],'O vértice é o ponto mais '+(a>0?'baixo':'alto')+' da parábola.')+tb(f,xs)};

/* ===== Equação 2º grau ===== */
const ce2i=v=>{const a=N(v.a),b=N(v.b),c=N(v.c);if(a==0)return err('a precisa ser diferente de 0.');let s=[],x=[];if(b==0&&c==0){s.push('ax² = 0 → x = 0');x=[0]}else if(b==0){const t=-c/a;s.push('Isole x²: x² = −c/a = '+n(-c)+'/'+pr(a)+' = '+n(t));if(t<0)s.push('Número negativo não tem raiz quadrada real.');else{x=t==0?[0]:[-Math.sqrt(t),Math.sqrt(t)];s.push('x = ±√'+n(t)+' = ±'+n(Math.sqrt(t)))}}else if(c==0){x=[0,-b/a].sort((p,q)=>p-q);s.push('Coloque x em evidência: x·('+n(a)+'x + '+pr(b)+') = 0','Produto zero: x = 0 ou '+n(a)+'x + '+pr(b)+' = 0 → x = '+n(-b/a))}else return err('Essa equação é completa (b ≠ 0 e c ≠ 0): use Bhaskara.');return ol(s)+res(x.length?'S = {'+x.map(n).join('; ')+'}':'S = ∅')+par(a,b,c,x.concat([0]),x.map(t=>[t,0]),'Raízes marcadas no eixo x.')};
const c2e=v=>{const a=N(v.a),b=N(v.b),c=N(v.c),d=N(v.d);if(a==0)return err('a precisa ser diferente de 0.');const cc=c-d,q=q2(a,b,cc),s=[];if(d!=0)s.push('Forma padrão: '+P({2:a,1:b,0:cc})+' = 0');s.push('a = '+n(a)+', b = '+n(b)+', c = '+n(cc));return ol(s.concat(q.s,q.x.map(x=>'Conferência x = '+n(x)+': '+n(a*x*x+b*x+cc))))+res(q.x.length?'S = {'+q.x.map(n).join('; ')+'}':'S = ∅ (sem raízes reais)')+par(a,b,cc,q.x.concat([q.xv]),q.x.map(x=>[x,0]),'Parábola '+P({2:a,1:b,0:cc})+': as raízes são os cruzamentos com o eixo x.')};

/* ===== Exponencial ===== */
const cE1=v=>{const a=N(v.a),b=N(v.b),x=N(v.x);if(b<=0||b==1)return err('A base precisa ser positiva e diferente de 1.');const f=t=>a*Math.pow(b,t);return ol(['f(x) = a·b<sup>x</sup> com a = '+n(a)+' (valor inicial) e b = '+n(b)+' (fator).','Como b '+(b>1?'> 1: crescimento (taxa de '+n((b-1)*100)+'% por período).':'está entre 0 e 1: decaimento (taxa de '+n((1-b)*100)+'% por período).'),'f('+n(x)+') = '+n(a)+'·'+pr(b)+'<sup>'+n(x)+'</sup> = '+n(a)+'·'+n(Math.pow(b,x))+' = '+n(f(x))])+res('f('+n(x)+') = '+n(f(x)))+graph(f,[[0,a],[x,f(x)]],-3,Math.max(x,3)+1,{cap:'Curva exponencial. Pontos: valor inicial e o valor calculado.'})};
const cE2=v=>{const a=N(v.a),b=N(v.b),c=N(v.c);if(b<=0||b==1||c/a<=0)return err('Use base positiva ≠ 1 e c/a positivo.');const x=Math.log(c/a)/Math.log(b);return ol(['Isole a potência: '+n(b)+'<sup>x</sup> = '+n(c)+'/'+pr(a)+' = '+n(c/a),'Aplique logaritmo nos dois lados: x·ln '+n(b)+' = ln '+n(c/a),'x = ln '+n(c/a)+' / ln '+n(b)+' = '+n(x)])+res('x = '+n(x))+graph(t=>a*Math.pow(b,t),[[x,c]],-1,Math.max(x*1.4,3),{f2:t=>c,cap:'Cheia: a·b^x. Tracejada: y = c. O ponto é a solução.'})};
const cE3=v=>{const b=N(v.b),c=N(v.c);if(b<=0||b==1||c<=0)return err('Use base positiva ≠ 1 e c positivo.');let k=null;for(let i=-12;i<=12;i++)if(Math.abs(Math.pow(b,i)-c)<1e-9*Math.max(1,c))k=i;const x=Math.log(c)/Math.log(b);return (k===null?ol(['Não consegui escrever '+n(c)+' como potência inteira de '+n(b)+'.','Use logaritmo (próximo tópico): x = ln '+n(c)+' / ln '+n(b)+' = '+n(x)]):ol(['Escreva '+n(c)+' na base '+n(b)+': '+n(c)+' = '+n(b)+'<sup>'+n(k)+'</sup>','Fica '+n(b)+'<sup>x</sup> = '+n(b)+'<sup>'+n(k)+'</sup>','Bases iguais → expoentes iguais: x = '+n(k)])+res('x = '+n(k)))+graph(t=>Math.pow(b,t),[[x,c]],-3,Math.max(x+2,4),{f2:t=>c,cap:'Cheia: y = b^x. Tracejada: y = c. O ponto é a solução.'})};

/* ===== Limites ===== */
const lim=v=>{const p=parse(v.p),q=parse(v.q);if(!p||!q||!ks(p).length||!ks(q).length)return BAD;if(![...ks(p),...ks(q)].every(k=>Number.isInteger(k)&&k>=0))return err('Use polinômios com expoentes inteiros.');const f=t=>ev(p,t)/ev(q,t),at=v.a.trim().toLowerCase().replace('∞','inf').replace('−','-');if(at.includes('inf')){const neg=at.startsWith('-'),dp=Math.max(...ks(p)),dq=Math.max(...ks(q)),lp=p[dp],lq=q[dq];let L;if(dp<dq)L=0;else if(dp==dq)L=lp/lq;else L=Math.sign(lp/lq)*(neg&&(dp-dq)%2?-1:1)*Infinity;return ol(['Compare os termos de maior grau: '+TS(lp,dp)+' no numerador e '+TS(lq,dq)+' no denominador.',dp<dq?'Grau do numerador menor: o limite é 0.':dp==dq?'Graus iguais: o limite é a razão dos coeficientes, '+n(lp)+'/'+n(lq)+'.':'Grau do numerador maior: o limite é infinito.'])+res('limite = '+(isFinite(L)?n(L):L>0?'+∞':'−∞'))+graph(f,[],-10,10,{f2:isFinite(L)?(t=>L):undefined,cap:'Cheia: p(x)/q(x). Tracejada: a reta que a função alcança.'})}const a=N(at);let P1=p,Q1=q,i=0;const s=['Substituindo x = '+n(a)+': numerador = '+n(ev(p,a))+' e denominador = '+n(ev(q,a))];while(Math.abs(ev(P1,a))<1e-9&&Math.abs(ev(Q1,a))<1e-9&&i<6){P1=div(P1,a);Q1=div(Q1,a);i++;s.push('0/0 é indeterminação: fatore (x − '+n(a)+') e simplifique → ('+P(P1)+') / ('+P(Q1)+')')}const nv=ev(P1,a),dv=ev(Q1,a);let L,r;if(Math.abs(dv)<1e-9){s.push('Denominador → 0 com numerador ≠ 0: o limite é infinito; compare os limites laterais.');r='±∞ (laterais)'}else{L=nv/dv;s.push(i?'Substituindo de novo: '+n(nv)+'/'+n(dv):'Substituição direta: '+n(nv)+'/'+n(dv)+' (não é indeterminação)');r=n(L)}return ol(s)+res('limite = '+r)+graph(f,L===undefined?[]:[[a,L]],a-4,a+4,{cap:'Cheia: p(x)/q(x). O ponto marca o valor do limite em x = '+n(a)+'.'})};

/* ===== Derivadas ===== */
const cD0=v=>{const p=parse(v.f),x=N(v.x);if(!p)return BAD;const d=der(p),f=t=>ev(p,t);return ol(['f′(x) = lim [f(x + h) − f(x)]/h. Aqui f('+n(x)+') = '+n(f(x))].concat([1,.1,.01,.001].map(h=>'h = '+n(h)+': [f('+n(x+h)+') − f('+n(x)+')]/h = ('+n(f(x+h))+' − '+pr(f(x))+')/'+n(h)+' = '+n((f(x+h)-f(x))/h)),['Os valores se aproximam de '+n(ev(d,x))+' quando h → 0 (confere com a regra: f′(x) = '+P(d)+').']))+res('f′('+n(x)+') = '+n(ev(d,x)))+graph(f,[[x,f(x)]],...rng([x-2,x+2]),{f2:t=>f(x)+ev(d,x)*(t-x),cap:'Cheia: f(x). Tracejada: reta tangente em x = '+n(x)+' (a inclinação é f′).'})};
const cK=v=>{const k=N(v.k);return ol(['f(x) = '+n(k)+' é constante: o valor não muda quando x muda.','Taxa de variação = (variação de y)/(variação de x) = 0/Δx = 0.','Regra: (k)′ = 0'])+res('f′(x) = 0')+graph(t=>k,[[0,k]],-5,5,{f2:t=>0,cap:'Cheia: f(x) = '+n(k)+' (reta horizontal). Tracejada: f′(x) = 0.'})};
const cP=v=>{const c=N(v.c),k=N(v.n),x=N(v.x),f=t=>c*Math.pow(t,k),g=t=>c*k*Math.pow(t,k-1);return ol(['Identifique: c = '+n(c)+' (coeficiente) e n = '+n(k)+' (expoente).','Multiplique o coeficiente pelo expoente: c·n = '+pr(c)+'·'+pr(k)+' = '+n(c*k),'Reduza o expoente em 1: n − 1 = '+n(k)+' − 1 = '+n(k-1),'Resultado: f′(x) = '+TZ(c*k,k-1),'Em x = '+n(x)+': f′ = '+n(g(x))])+res('f′(x) = '+TZ(c*k,k-1))+graph(f,[[x,f(x)]],-3,3,{f2:g,cap:'Cheia: f(x). Tracejada: f′(x).'})};
const c3=v=>{const p=parse(v.f);if(!p)return BAD;const d=der(p);let o=ol(ks(p).map(i=>i==0?TS(p[i],0)+' → 0 (constante)':TS(p[i],i)+' → '+TZ(p[i]*i,i-1)+' (multiplica por '+n(i)+' e reduz o expoente)').concat(['Junte as derivadas: '+P(d)]))+res('f′(x) = '+P(d));let pts=[];if(v.x0.trim()!==''){const x=N(v.x0);o+='<p>f′('+n(x)+') = '+n(ev(d,x))+' (inclinação da tangente) e f('+n(x)+') = '+n(ev(p,x))+'.</p>';pts=[[x,ev(p,x)]]}const r=R(d);if(r)o+='<p>f′(x) = 0 → '+(r.length?'x = '+r.map(n).join(' ou '):'sem solução real')+'</p>';return o+graph(t=>ev(p,t),pts,-4,4,{f2:t=>ev(d,t),cap:'Cheia: f(x). Tracejada: f′(x).'})};
const c6=v=>{const u=parse(v.u),w=parse(v.v);if(!u||!w)return BAD;const du=der(u),dw=der(w),S=add(mul(du,w),mul(u,dw)),uv=mul(u,w);return ol(['u = '+P(u)+' → u′ = '+P(du),'v = '+P(w)+' → v′ = '+P(dw),'y′ = u′·v + u·v′ = ('+P(du)+')·('+P(w)+') + ('+P(u)+')·('+P(dw)+')','Expandindo e somando: '+P(S),'Conferência: u·v = '+P(uv)+', cuja derivada é '+P(der(uv))])+res('y′ = '+P(S))+graph(t=>ev(uv,t),[],-4,4,{f2:t=>ev(S,t),cap:'Cheia: y = u·v. Tracejada: y′.'})};
const c7=v=>{const u=parse(v.u),w=parse(v.v);if(!u||!w)return BAD;const du=der(u),dw=der(w),Nn=sub(mul(du,w),mul(u,dw));return ol(['u = '+P(u)+' → u′ = '+P(du),'v = '+P(w)+' → v′ = '+P(dw),'Numerador: u′·v − u·v′ = ('+P(du)+')·('+P(w)+') − ('+P(u)+')·('+P(dw)+') = '+P(Nn),'Denominador: v² = ('+P(w)+')²'])+res('y′ = ('+P(Nn)+') / ('+P(w)+')²')+graph(t=>ev(u,t)/ev(w,t),[],-5,5,{f2:t=>ev(Nn,t)/Math.pow(ev(w,t),2),cap:'Cheia: y = u/v. Tracejada: y′.'})};
const cR=v=>{const u=parse(v.u);if(!u)return BAD;const du=der(u);return ol(['u = '+P(u)+' → u′ = '+P(du),'Regra: (√u)′ = u′/(2√u)','y′ = ('+P(du)+') / (2√('+P(u)+'))'])+res('y′ = ('+P(du)+') / (2√('+P(u)+'))')+graph(t=>Math.sqrt(ev(u,t)),[],-3,8,{f2:t=>ev(du,t)/(2*Math.sqrt(ev(u,t))),cap:'Cheia: y = √u. Tracejada: y′ (só existe onde u > 0).'})};
const c8=v=>{const u=parse(v.u),r=N(v.r);if(!u)return BAD;const du=der(u);return ol(['u = '+P(u)+' → u′ = '+P(du),'Regra: (u<sup>r</sup>)′ = r·u<sup>r−1</sup>·u′ com r = '+n(r),'y′ = '+n(r)+'·('+P(u)+')<sup>'+n(r-1)+'</sup>·('+P(du)+')'])+res('y′ = '+n(r)+'·('+P(u)+')<sup>'+n(r-1)+'</sup>·('+P(du)+')')+graph(t=>Math.pow(ev(u,t),r),[],-3,3,{f2:t=>r*Math.pow(ev(u,t),r-1)*ev(du,t),cap:'Cheia: y = u^r. Tracejada: y′.'})};
const cEL=v=>{const tp=v.t.trim().toLowerCase(),u=parse(v.u),a=N(v.a);if(!u)return BAD;const du=der(u),U=P(u),D=P(du);let f,g,s,o,r;if(tp=='e'){f=t=>Math.exp(ev(u,t));g=t=>ev(du,t)*f(t);s='y = e<sup>'+U+'</sup>';r='(e<sup>u</sup>)′ = u′·e<sup>u</sup>';o='('+D+')·e<sup>'+U+'</sup>'}else if(tp=='a'){if(a<=0||a==1)return err('Base a > 0 e ≠ 1.');f=t=>Math.pow(a,ev(u,t));g=t=>ev(du,t)*f(t)*Math.log(a);s='y = '+n(a)+'<sup>'+U+'</sup>';r='(a<sup>u</sup>)′ = u′·a<sup>u</sup>·ln a';o='('+D+')·'+n(a)+'<sup>'+U+'</sup>·ln '+n(a)}else if(tp=='ln'){f=t=>Math.log(ev(u,t));g=t=>ev(du,t)/ev(u,t);s='y = ln('+U+')';r='(ln u)′ = u′/u';o='('+D+')/('+U+')'}else if(tp=='log'){if(a<=0||a==1)return err('Base a > 0 e ≠ 1.');f=t=>Math.log(ev(u,t))/Math.log(a);g=t=>ev(du,t)/(ev(u,t)*Math.log(a));s='y = log<sub>'+n(a)+'</sub>('+U+')';r='(log<sub>a</sub> u)′ = u′/(u·ln a)';o='('+D+')/(('+U+')·ln '+n(a)+')'}else return err('Em Tipo digite e, a, ln ou log.');return ol([s,'Regra: '+r,'u = '+U+' → u′ = '+D,'Aplicando: y′ = '+o])+res('y′ = '+o)+graph(f,[],-3,3,{f2:g,cap:'Cheia: y. Tracejada: y′.'})};
const cTr=v=>{const fn=v.fn.trim().toLowerCase(),a=N(v.a),k=N(v.k),K=n(k),A=n(a);let f,g,s,o,r;if(fn=='sen'){f=t=>a*Math.sin(k*t);g=t=>a*k*Math.cos(k*t);r='(sen u)′ = u′·cos u';s=A+'·sen('+K+'x)';o=n(a*k)+'·cos('+K+'x)'}else if(fn=='cos'){f=t=>a*Math.cos(k*t);g=t=>-a*k*Math.sin(k*t);r='(cos u)′ = −u′·sen u';s=A+'·cos('+K+'x)';o=n(-a*k)+'·sen('+K+'x)'}else if(fn=='tg'){f=t=>a*Math.tan(k*t);g=t=>a*k/Math.pow(Math.cos(k*t),2);r='(tg u)′ = u′·sec² u';s=A+'·tg('+K+'x)';o=n(a*k)+'·sec²('+K+'x)'}else return err('Em Função digite sen, cos ou tg.');return ol(['y = '+s,'Regra: '+r+' (aqui u = '+K+'x, então u′ = '+K+')','Multiplique pelo coeficiente a = '+A+': y′ = '+o])+res('y′ = '+o)+graph(f,[],-6.3,6.3,{f2:g,clip:6,cap:'Cheia: y. Tracejada: y′ (x em radianos).'})};
const cHi=v=>{const p=parse(v.f),m=Math.round(N(v.m));if(!p)return BAD;if(m<1||m>6)return err('Use ordem de 1 a 6.');const mk=['','′','″','‴'];let q=p;const s=['f(x) = '+P(p)];for(let i=1;i<=m;i++){q=der(q);s.push('f'+(i<4?mk[i]:'<sup>('+i+')</sup>')+'(x) = derivada de f'+(i==1?'':(i-1<4?mk[i-1]:'<sup>('+(i-1)+')</sup>'))+' = '+P(q))}return ol(s)+res('f'+(m<4?mk[m]:'<sup>('+m+')</sup>')+'(x) = '+P(q))+graph(t=>ev(p,t),[],-4,4,{f2:t=>ev(q,t),cap:'Cheia: f(x). Tracejada: a derivada de ordem '+m+'.'})};
const cTan=v=>{const p=parse(v.f),x=N(v.x0);if(!p)return BAD;const d=der(p),y0=ev(p,x),m=ev(d,x),b=y0-m*x;return ol(['f′(x) = '+P(d),'Inclinação: m = f′('+n(x)+') = '+n(m),'Ponto: f('+n(x)+') = '+n(y0),'Reta: y − '+pr(y0)+' = '+pr(m)+'·(x − '+pr(x)+')','Isolando y: y = '+P({1:m,0:b})])+res('y = '+P({1:m,0:b}))+graph(t=>ev(p,t),[[x,y0]],...rng([x-3,x+3]),{f2:t=>m*t+b,cap:'Cheia: f(x). Tracejada: reta tangente no ponto marcado.'})};

/* ===== Aplicações da derivada ===== */
const mg=K=>v=>{const F=parse(v.F),q=N(v.q);if(!F)return BAD;const d=der(F),k=K=='Custo'?'C':'R';return ol([k+'(q) = '+P(F),K+' marginal: '+k+'mg(q) = '+k+'′(q) = '+P(d),'Em q = '+n(q)+': '+k+'mg('+n(q)+') = '+n(ev(d,q))])+cp('O '+K.toLowerCase()+' marginal é a derivada de '+k+'(q): '+k+'mg(q) = '+P(d)+'. Para q = '+n(q)+', '+k+'mg = '+n(ev(d,q))+', ou seja, a unidade seguinte '+(K=='Custo'?'custa':'rende')+' cerca de '+n(ev(d,q))+'.')+graph(t=>ev(F,t),[[q,ev(F,q)]],0,Math.max(2*q,10),{f2:t=>ev(d,t),cap:'Cheia: '+k+'(q). Tracejada: '+k+'mg(q).'})};
const j1=v=>{const r=parse(v.r),c=parse(v.c);if(!r||!c)return BAD;const L=sub(r,c),d=der(L),d2=der(d),rt=R(d);let s=['Lucro: L(x) = R(x) − C(x) = ('+P(r)+') − ('+P(c)+') = '+P(L),'Receita marginal Rmg = '+P(der(r))+' e custo marginal Cmg = '+P(der(c)),'Lucro marginal: L′(x) = '+P(d)];if(v.q.trim()!==''){const q=N(v.q);s.push('Em q = '+n(q)+': Rmg = '+n(ev(der(r),q))+', Cmg = '+n(ev(der(c),q))+', Lmg = '+n(ev(d,q)))}let t='A função lucro é L(x) = '+P(L)+'. Derivando, o lucro marginal é L′(x) = '+P(d)+'.';if(rt&&rt.length){s.push('Igualando a zero: L′(x) = 0 → x = '+rt.map(n).join(' ou '));let best=null;rt.forEach(x=>{const q=ev(d2,x),l=ev(L,x);s.push('Em x = '+n(x)+': L″ = '+n(q)+' → '+(q<0?'máximo':q>0?'mínimo':'inconclusivo')+'; L('+n(x)+') = '+n(l));if(q<0&&(!best||l>best[1]))best=[x,l]});t+=' Igualando a zero, obtemos x = '+rt.map(n).join(' ou ')+'.';if(best)t+=' Como L″ < 0 nesse ponto, ele é de máximo. Substituindo, L('+n(best[0])+') = '+n(best[1])+'. Portanto, o lucro máximo é '+n(best[1])+', obtido com '+n(best[0])+' unidades.'}else t+=' Não há ponto crítico real para otimizar.';const hi=rt&&rt.length&&Math.max(...rt)>0?Math.max(...rt)*1.8:10;return ol(s)+cp(t)+graph(x=>ev(L,x),(rt||[]).map(x=>[x,ev(L,x)]),0,hi,{f2:x=>ev(d,x),cap:'Cheia: L(x). Tracejada: L′(x). Pontos: onde L′ = 0.'})};
const cMax=v=>{const p=parse(v.f);if(!p)return BAD;const d=der(p),d2=der(d),r=R(d);if(!r)return err('Aqui resolvo f′ = 0 só até grau 2 (f de grau até 3).');const s=['f′(x) = '+P(d),'f′(x) = 0 → '+(r.length?'x = '+r.map(n).join(' ou '):'sem solução real'),'f″(x) = '+P(d2)];r.forEach(x=>{const q=ev(d2,x);s.push('x = '+n(x)+': f″ = '+n(q)+' → '+(q>0?'mínimo':q<0?'máximo':'inconclusivo')+'; f('+n(x)+') = '+n(ev(p,x)))});return ol(s)+graph(t=>ev(p,t),r.map(x=>[x,ev(p,x)]),...rng(r.concat([0])),{f2:t=>ev(d,t),cap:'Cheia: f(x). Tracejada: f′(x), que vale 0 nos pontos críticos.'})};

/* ===== Integrais ===== */
const c4a=v=>{const p=parse(v.f);if(!p)return BAD;const I=integ(p);if(!I)return err('Termo 1/x: ∫ 1/x dx = ln|x| + C (fora desta calculadora).');return ol(ks(p).map(i=>TS(p[i],i)+' → '+TS(p[i]/(i+1),i+1)+' (soma 1 ao expoente e divide por '+n(i+1)+'; constante multiplicando sai da integral)').concat(['Junte os termos e some a constante C.']))+res('∫ f dx = '+P(I)+' + C')+graph(t=>ev(p,t),[],-3,3,{f2:t=>ev(I,t),cap:'Cheia: f(x). Tracejada: uma primitiva F(x) (com C = 0).'})};
const c4b=v=>{const p=parse(v.f);if(!p)return BAD;const I=integ(p);if(!I)return err('Termo 1/x: fora desta calculadora.');const a=N(v.a),b=N(v.b),Fb=ev(I,b),Fa=ev(I,a);return ol(['Primitiva: F(x) = '+P(I),'F('+n(b)+') = '+n(Fb),'F('+n(a)+') = '+n(Fa),'∫ de '+n(a)+' até '+n(b)+' = F(b) − F(a) = '+n(Fb)+' − '+pr(Fa)])+res('integral = '+n(Fb-Fa))+graph(t=>ev(p,t),[],...rng([a,b,0]),{area:[a,b,t=>0],cap:'A região sombreada, entre x = '+n(a)+' e x = '+n(b)+', tem valor '+n(Fb-Fa)+' (partes abaixo do eixo contam negativo).'})};
const cInit=v=>{const p=parse(v.f),x0=N(v.x0),y0=N(v.y0);if(!p)return BAD;const I=integ(p);if(!I)return err('Termo 1/x: fora desta calculadora.');const K=y0-ev(I,x0),F=add(I,{0:K});return ol(['∫ f dx = '+P(I)+' + C','Condição F('+n(x0)+') = '+n(y0)+': '+n(ev(I,x0))+' + C = '+n(y0),'C = '+n(y0)+' − '+pr(ev(I,x0))+' = '+n(K)])+res('F(x) = '+P(F))+graph(t=>ev(F,t),[[x0,y0]],...rng([x0-3,x0+3]),{f2:t=>ev(p,t),cap:'Cheia: F(x). Tracejada: f(x) = F′(x). O ponto é a condição inicial.'})};

/* ===== Aplicações da integral ===== */
const j2=v=>{const p=parse(v.m);if(!p)return BAD;const F=N(v.k),I=integ(p);if(!I)return err('Há termo 1/x: sua integral é ln|x|.');const I2=add(I,{0:F});return ol(['Do marginal ao total: integre o custo marginal.'].concat(ks(p).map(i=>TS(p[i],i)+' → '+TS(p[i]/(i+1),i+1)),['C(q) = '+P(I)+' + K','Custo fixo: C(0) = K = '+n(F)]))+cp('O custo marginal é C′(q) = '+P(p)+'. O custo total é a integral do custo marginal: C(q) = '+P(I)+' + K. Como o custo fixo é C(0) = '+n(F)+', temos K = '+n(F)+'. Logo, C(q) = '+P(I2)+'.')+graph(t=>ev(I2,t),[[0,F]],0,10,{f2:t=>ev(p,t),cap:'Cheia: C(q). Tracejada: Cmg(q). O ponto é o custo fixo.'})};
const ec=v=>{const p=parse(v.p),q0=N(v.q);if(!p)return BAD;const p0=ev(p,q0),E=sub(p,{0:p0}),I=integ(E);return ol(['Preço de equilíbrio: p₀ = p('+n(q0)+') = '+n(p0),'Integrando: p(q) − p₀ = '+P(E)+' → F = '+P(I),'EC = F('+n(q0)+') − F(0) = '+n(ev(I,q0))+' − 0'])+res('EC = '+n(ev(I,q0)))+cp('O excedente do consumidor é a integral de 0 até '+n(q0)+' de [p(q) − '+n(p0)+'] dq, que vale '+n(ev(I,q0))+' unidades monetárias.')+graph(t=>ev(p,t),[[q0,p0]],0,q0*1.5,{f2:t=>p0,area:[0,q0,t=>p0],cap:'Cheia: demanda p(q). Tracejada: preço p₀. A área sombreada entre a demanda e o preço é o excedente.'})};

const tx1=v=>{const f=N(v.f),u=N(v.u),t=N(v.t);if(u==0)return err('O valor por unidade não pode ser 0.');const x=(t-f)/u;return ol(['Seja x a quantidade. Total = fixo + unitário·x → '+n(f)+' + '+n(u)+'x = '+n(t),'Isole: '+n(u)+'x = '+n(t)+' − '+pr(f)+' = '+n(t-f),'x = '+n(t-f)+'/'+n(u)+' = '+n(x)])+cp('Definindo x como a quantidade, o total é '+n(f)+' + '+n(u)+'x. Igualando a '+n(t)+', obtemos x = '+n(x)+'.')+graph(s=>f+u*s,[[x,t]],0,Math.max(x*1.5,5),{f2:s=>t,cap:'Cheia: total em função de x. Tracejada: o total dado. O ponto é a solução.'})};

const mq=(set,pick,ans)=>v=>{const d=N(v.d),A=N(v.p),q=q2(1,d,-A),r=pick(q.x);return ol([set(d,A)].concat(q.s,[r===undefined?'Nenhuma raiz serve ao problema.':'Valor que serve: '+n(r)]))+(r===undefined?'':cp(ans(r,d,q.x.find(y=>y!==r))))+graph(t=>t*t+d*t-A,q.x.map(y=>[y,0]),...rng(q.x.concat([0])),{cap:'Parábola x² + '+n(d)+'x − '+n(A)+'. As raízes são os cruzamentos com o eixo x; só uma serve ao problema.'})};

TP('f1','coef','Forma geral e coeficientes','Função cujo gráfico é uma reta, escrita como f(x) = ax + b.',['f(x) = ax + b','a = coeficiente angular (inclinação)','b = coeficiente linear (onde corta o eixo y)'],['“custo fixo de 5.000 mais 15 por unidade” ➜ C(x) = 15x + 5.000','“R$ 4 por km mais R$ 6 de bandeirada” ➜ f(x) = 4x + 6','“tanque de 50 L que perde 1 L a cada 10 km” ➜ f(x) = −x/10 + 50'],['x = quantidade variável (km, unidades, tempo)','a = quanto muda a cada 1 unidade de x (“por unidade”, “por km”)','b = valor inicial, quando x = 0 (“fixo”, “inicial”, “bandeirada”)'],['Ache o valor “por unidade” e use como a (negativo se diminui).','Ache o valor inicial e use como b.','Monte f(x) = ax + b.','Substitua x e calcule f(x).'],'cA',[['C(x) = 15x + 5.000. Quanto custa produzir 100 unidades?',{}],['f(x) = −x/10 + 50. Quanto combustível resta após 200 km?',{a:'−1/10',b:'50',x:'200'}],['Táxi: R$ 4 por km mais R$ 6 de bandeirada. Preço de 12 km?',{a:'4',b:'6',x:'12'}],['f(x) = 3x − 7. Valor em x = 5',{a:'3',b:'−7',x:'5'}]]),
TP('f1','raiz','Raiz e estudo do sinal','A raiz é o x que zera a função. O estudo do sinal diz quando f(x) é positiva, negativa ou zero.',['raiz: ax + b = 0 → x = −b/a','a > 0: f(x) > 0 à direita da raiz','a < 0: f(x) > 0 à esquerda da raiz'],['“ponto de equilíbrio”, “custo igual à receita” ➜ L(x) = 0','“a partir de quantas unidades há lucro?” ➜ L(x) > 0','“quando o tanque fica vazio?” ➜ f(x) = 0'],['a = define se cresce ou decresce','−b/a = raiz (onde o sinal muda)','f(x) > 0 acima do eixo x; f(x) < 0 abaixo'],['Iguale a função a zero.','Isole x: x = −b/a.','Olhe o a: crescente (a > 0) ou decrescente (a < 0).','Monte o quadro de sinais: zero na raiz, sinal de a de um lado e o oposto do outro.'],'c1',[['f(x) = 2x − 8',{}],['f(x) = −x/10 + 50. Quando o tanque esvazia?',{a:'−1/10',b:'50'}],['L(x) = 2x − 30.000. Ponto de equilíbrio',{a:'2',b:'−30000'}],['f(x) = −3x + 9',{a:'−3',b:'9'}]]),
TP('f1','pontos','Reta por dois pontos','Quando o enunciado dá dois pontos da reta (ou o gráfico), calcule a inclinação e depois o b.',['a = (y₂ − y₁)/(x₂ − x₁)','b = y₁ − a·x₁','f(x) = ax + b'],['“a reta passa por (0; 3) e (4; 0)” ➜ P₁(0; 3) e P₂(4; 0)','“com 0 km há 50 L e com 500 km há 0 L” ➜ (0; 50) e (500; 0)','“custo 8.000 com 200 peças e 11.000 com 400” ➜ (200; 8000) e (400; 11000)'],['(x₁; y₁) e (x₂; y₂) = os dois pontos','a = variação de y dividida pela variação de x','b = valor de y quando x = 0'],['Anote os dois pontos.','Calcule a = Δy/Δx.','Calcule b = y₁ − a·x₁.','Escreva f(x) = ax + b e confira no outro ponto.'],'c1b',[['Reta por (0; 3) e (4; 0)',{}],['Combustível: (0; 50) e (500; 0)',{x1:'0',y1:'50',x2:'500',y2:'0'}],['Custo: (200; 8000) e (400; 11000)',{x1:'200',y1:'8000',x2:'400',y2:'11000'}],['Reta por (1; 5) e (3; 11)',{x1:'1',y1:'5',x2:'3',y2:'11'}]]),
TP('e1','simples','Equação simples e com x dos dois lados','Igualdade com uma incógnita de grau 1: x de um lado, números do outro.',['ax + b = 0 → x = −b/a','ax + b = cx + d → x = (d − b)/(a − c)'],['“o custo foi R$ 8.000: quantas peças?” ➜ 5.000 + 15x = 8.000','“uma conta igual à outra” ➜ ax + b = cx + d','“qual a quantidade, sabendo que…” ➜ isole x'],['x = incógnita (o que se pergunta)','a e c = valores por unidade','b e d = valores fixos, números soltos'],['Defina x.','Monte a igualdade com o texto.','Agrupe: termos com x de um lado, números do outro (trocou de lado, troca o sinal).','Divida pelo coeficiente de x.','Confira substituindo.'],'c5',[['5.000 + 15x = 8.000',{}],['2x + 5 = −x + 11',{a:'2',b:'5',c:'−1',d:'11'}],['3x − 4 = x + 10',{a:'3',b:'−4',c:'1',d:'10'}],['8x = 4x + 20',{a:'8',b:'0',c:'4',d:'20'}]]),
TP('e1','fracoes','Equação com frações','Multiplique os dois lados pelo m.m.c. dos denominadores para eliminar as frações.',['m.m.c. dos denominadores = L','multiplique todos os termos por L','depois: Ax + B = Cx + D'],['“dois quintos de y menos…” ➜ 2y/5 − …','“a terça parte de x mais 5” ➜ x/3 + 5'],['p/q = fração (p numerador, q denominador)','L = m.m.c. dos denominadores'],['Liste os denominadores.','Calcule o m.m.c. (L).','Multiplique cada termo por L.','Resolva a equação resultante.'],'cFr',[['2y/5 − (5 − 2y)/3 = 1, já expandido: (2/5 + 2/3)y − 5/3 = 1',{}],['x/2 + 3 = x/3 + 5',{a:'1/2',b:'3',c:'1/3',d:'5'}],['3x/4 − 1 = x/2 + 2',{a:'3/4',b:'−1',c:'1/2',d:'2'}]]),
TP('f2','coef','Concavidade e coeficientes','Parábola de equação f(x) = ax² + bx + c, com a ≠ 0.',['f(x) = ax² + bx + c','a > 0: concavidade para cima (mínimo)','a < 0: concavidade para baixo (máximo)','c = onde corta o eixo y'],['“o lucro é L(x) = −x² + 20x − 36” ➜ a = −1, b = 20, c = −36','“a receita sobe e depois cai” ➜ parábola com a < 0','“custo mínimo” ➜ parábola com a > 0'],['a = coeficiente de x² (abertura e concavidade)','b = coeficiente de x','c = termo sozinho (valor em x = 0)'],['Escreva na ordem ax² + bx + c.','Identifique a, b e c com seus sinais.','Olhe o sinal de a.','Marque (0; c) no gráfico.'],'c2a',[['L(x) = −x² + 20x − 36',{}],['f(x) = x² − 5x + 6',{a:'1',b:'−5',c:'6'}],['f(x) = 2x² + 3',{a:'2',b:'0',c:'3'}],['f(x) = −0,5x² + 40x − 60',{a:'−0,5',b:'40',c:'−60'}]]),
TP('f2','raizes','Raízes e discriminante (Δ)','As raízes são os x em que f(x) = 0 (onde a parábola corta o eixo x). O Δ diz quantas existem.',['Δ = b² − 4ac','x = (−b ± √Δ)/2a','Δ > 0: 2 raízes; Δ = 0: 1 raiz; Δ < 0: nenhuma real'],['“lucro igual a zero”, “equilíbrio” ➜ L(x) = 0','“onde toca o chão” ➜ f(x) = 0','“quantas vezes corta o eixo x?” ➜ sinal de Δ'],['Δ = discriminante','x₁ e x₂ = raízes'],['Identifique a, b e c.','Calcule Δ.','Veja o sinal de Δ.','Aplique a fórmula e ache x₁ e x₂.','Marque as raízes no eixo x.'],'c2b',[['f(x) = x² − 5x + 6',{}],['y = −x² + 7x − 12',{a:'−1',b:'7',c:'−12'}],['f(x) = x² − 4x + 4 (Δ = 0)',{a:'1',b:'−4',c:'4'}],['f(x) = x² + x + 1 (Δ < 0)',{a:'1',b:'1',c:'1'}]]),
TP('f2','vertice','Vértice, máximo e mínimo','O vértice é o ponto mais alto (a < 0) ou mais baixo (a > 0) da parábola.',['xᵥ = −b/2a','yᵥ = −Δ/4a (ou f(xᵥ))','a < 0: máximo; a > 0: mínimo'],['“qual preço dá o maior lucro?” ➜ xᵥ','“qual o lucro máximo?” ➜ yᵥ','“menor custo de produção” ➜ vértice com a > 0'],['xᵥ = valor de x do pico (preço, quantidade)','yᵥ = valor máximo ou mínimo da função'],['Identifique a, b e c.','Calcule xᵥ = −b/2a.','Calcule yᵥ = f(xᵥ).','Diga se é máximo ou mínimo pelo sinal de a.','Responda com unidade.'],'c2c',[['L(x) = −2x² + 16x − 20. Preço do maior lucro?',{}],['y = −x² + 7x − 12',{a:'−1',b:'7',c:'−12'}],['C(x) = x² − 6x + 10. Custo mínimo?',{a:'1',b:'−6',c:'10'}],['f(x) = x² − 5x + 6',{a:'1',b:'−5',c:'6'}]]),
TP('e2','incompleta','Equação incompleta','Quando b = 0 ou c = 0 dá para resolver sem Bhaskara.',['b = 0: ax² + c = 0 → x = ±√(−c/a)','c = 0: ax² + bx = 0 → x(ax + b) = 0 → x = 0 ou x = −b/a'],['“um número ao quadrado menos 25 é zero” ➜ x² − 25 = 0','“o lucro se anula em x = 0 e em outro ponto” ➜ c = 0'],['a, b, c = coeficientes; b ou c vale zero'],['Veja qual coeficiente é zero.','b = 0: isole x² e extraia a raiz (±).','c = 0: coloque x em evidência.','Confira.'],'ce2i',[['x² − 25 = 0',{}],['x² − 16 = 0',{c:'−16'}],['2x² − 8x = 0',{a:'2',b:'−8',c:'0'}],['x² + 9 = 0 (sem raiz real)',{c:'9'}]]),
TP('e2','bhaskara','Fórmula de Bhaskara (equação completa)','Resolve qualquer ax² + bx + c = 0.',['Δ = b² − 4ac','x = (−b ± √Δ)/2a'],['“o produto de dois números é…” ➜ x(x + 20) = 525','“a área é 1.200 m²” ➜ x(x + 40) = 1.200','“100p − 5p² = 375” ➜ 5p² − 100p + 375 = 0'],['a, b, c = coeficientes (com sinal)','Δ = discriminante','x₁, x₂ = soluções'],['Leve tudo para um lado: ax² + bx + c = 0.','Identifique a, b e c.','Calcule Δ.','Calcule x₁ e x₂.','Descarte raízes que não servem.'],'c2e',[['x² − 5x + 4 = 0',{}],['t² − 6t + 8 = 0',{b:'−6',c:'8'}],['−x² + 10x − 16 = 0',{a:'−1',b:'10',c:'−16'}],['100p − 5p² = 375 → 5p² − 100p + 375 = 0',{a:'5',b:'−100',c:'375'}],['2x² + x = 15',{a:'2',b:'1',c:'0',d:'15'}],['x² − 16x + 64 = 0 (Δ = 0)',{b:'−16',c:'64'}]]),
TP('ex','funcao','Função exponencial','Função em que x está no expoente: f(x) = a·bˣ, com b > 0 e b ≠ 1.',['f(x) = a·b^x','b > 1: crescimento','0 < b < 1: decaimento'],['“dobra a cada ano” ➜ b = 2','“cresce 5% ao mês” ➜ b = 1,05','“perde 10% ao ano” ➜ b = 0,9','“valor inicial 100” ➜ a = 100'],['a = valor inicial (x = 0)','b = fator (1 + taxa, ou 1 − taxa)','x = tempo em períodos'],['Ache o valor inicial a.','Ache o fator b.','Substitua x e calcule bˣ.','Multiplique por a.'],'cE1',[['100 que cresce 5% ao ano: valor após 10 anos?',{}],['1.000 que perde 10% ao ano: valor após 3 anos',{a:'1000',b:'0,9',x:'3'}],['f(x) = 2ˣ em x = 5',{a:'1',b:'2',x:'5'}],['f(x) = 3·2ˣ em x = 4',{a:'3',b:'2',x:'4'}]]),
TP('ex','base','Equação exponencial: mesma base','Quando os dois lados viram potências da mesma base, iguale os expoentes.',['bˣ = b^k ⇒ x = k','b^m · b^n = b^(m+n)','(b^m)^n = b^(m·n)'],['“2 elevado a x é 32” ➜ 2^x = 32 = 2^5','“81 é 3 elevado a quê?” ➜ 3^x = 81'],['b = base','c = valor do outro lado (potência de b)','k = expoente inteiro com b^k = c'],['Fatore o número do outro lado na base b.','Reescreva c = b^k.','Iguale os expoentes: x = k.'],'cE3',[['2ˣ = 32',{}],['3ˣ = 81',{b:'3',c:'81'}],['5ˣ = 1/25',{b:'5',c:'0,04'}],['10ˣ = 1.000',{b:'10',c:'1000'}]]),
TP('ex','log','Equação exponencial com logaritmo','Quando não dá para igualar as bases, use logaritmo.',['a·b^x = c','b^x = c/a','x = ln(c/a)/ln b'],['“em quanto tempo o capital dobra?” ➜ a·1,05^t = 2a','“quando chega a 500?” ➜ 100·1,05^t = 500'],['a = valor inicial','c = valor final','b = fator'],['Isole a potência: b^x = c/a.','Aplique ln nos dois lados.','x = ln(c/a)/ln b.'],'cE2',[['100·1,05ˣ = 200 (dobrar)',{}],['2ˣ = 10',{a:'1',b:'2',c:'10'}],['500·1,1ˣ = 1.000',{a:'500',b:'1,1',c:'1000'}]]),
TP('lm','direto','Limite por substituição direta','O limite diz para onde f(x) se aproxima quando x se aproxima de a. Se f(a) existe, basta substituir.',['lim x→a f(x) = f(a), se f(a) existir','lim (f ± g) = lim f ± lim g','lim (f·g) = lim f · lim g; lim (f/g) = lim f / lim g (denominador ≠ 0)'],['“quando x tende a 3” ➜ x → 3','“valor para o qual f se aproxima” ➜ limite','“limite de x² + 1 em x = 2” ➜ lim x→2 (x² + 1)'],['a = ponto de aproximação','L = valor do limite'],['Substitua x por a.','Se der número real, esse é o limite.','Se der 0/0, vá ao próximo tópico.'],'limD',[['lim x→2 de (x² + 1)',{}],['lim x→3 de x',{p:'x',a:'3'}],['lim x→1 de (x + 3)/(x + 1)',{p:'x + 3',q:'x + 1',a:'1'}],['lim x→0 de (2x + 5)/(x + 1)',{p:'2x + 5',q:'x + 1',a:'0'}]]),
TP('lm','zero','Indeterminação 0/0','Se a substituição dá 0/0, fatore por (x − a), simplifique e substitua de novo.',['0/0 ⇒ fatore (x − a)','x² − a² = (x − a)(x + a)'],['“limite de (x² − 4)/(x − 2) em 2” ➜ dá 0/0','“a função não existe em a, mas o limite sim” ➜ buraco'],['a = ponto','p(a) = 0 e q(a) = 0 (os dois zeram)'],['Substitua e veja 0/0.','Fatore numerador e denominador por (x − a).','Cancele o fator.','Substitua novamente.'],'limZ',[['lim x→2 de (x² − 4)/(x − 2)',{}],['lim x→1 de (x² − 1)/(x − 1)',{p:'x^2 − 1',q:'x − 1',a:'1'}],['lim x→3 de (x² − 9)/(x − 3)',{p:'x^2 − 9',q:'x − 3',a:'3'}],['lim x→2 de (x² − 5x + 6)/(x − 2)',{p:'x^2 − 5x + 6',q:'x − 2',a:'2'}]]),
TP('lm','inf','Limite no infinito','Quando x cresce sem limite, compare os termos de maior grau.',['grau do numerador < denominador → 0','graus iguais → razão dos coeficientes','grau do numerador maior → ±∞'],['“quando x tende ao infinito” ➜ x → ∞','“a longo prazo” ➜ x → ∞'],['dp, dq = graus de p e q','lp, lq = coeficientes de maior grau'],['Ache o termo de maior grau de cima e de baixo.','Compare os graus.','Aplique a regra correspondente.'],'limI',[['lim x→∞ de (3x² + 1)/(x² − 5)',{}],['lim x→∞ de (2x + 1)/(x² + 3)',{p:'2x + 1',q:'x^2 + 3'}],['lim x→∞ de (x² + 1)/(x + 1)',{p:'x^2 + 1',q:'x + 1'}],['lim x→∞ de (5x − 2)/(2x + 7)',{p:'5x − 2',q:'2x + 7'}]]),
TP('dv','def','Definição de derivada','A derivada é a taxa de variação instantânea: o limite da taxa média quando h → 0. Geometricamente, é a inclinação da reta tangente.',['f′(x) = lim h→0 [f(x + h) − f(x)] / h','taxa média = [f(x + h) − f(x)] / h'],['“taxa de variação instantânea” ➜ f′(x)','“velocidade num instante” ➜ derivada da posição','“inclinação da tangente em x₀” ➜ f′(x₀)'],['f(x) = função original','x₀ = ponto de interesse','h = pequeno acréscimo em x','f′(x₀) = inclinação'],['Calcule f(x₀) e f(x₀ + h).','Monte o quociente.','Faça h cada vez menor.','Veja para onde o valor tende.'],'cD0',[['f(x) = x² em x = 3',{}],['f(x) = 3x + 1 em x = 2',{f:'3x + 1',x:'2'}],['f(x) = x³ em x = 1',{f:'x^3',x:'1'}],['f(x) = 2x² − x em x = 2',{f:'2x^2 − x',x:'2'}]]),
TP('dv','const','Derivada de constante','A derivada de um número fixo é zero, porque ele não varia.',['(k)′ = 0'],['“custo fixo de 500” ➜ o termo fixo some ao derivar','“valor constante” ➜ f(x) = k'],['k = qualquer número sem x'],['Confira que não há x no termo.','A derivada é 0.'],'cK',[['f(x) = 7',{}],['f(x) = −3',{k:'−3'}],['custo fixo de 500',{k:'500'}],['f(x) = 0,5',{k:'0,5'}]]),
TP('dv','pot','Regra da potência (tombo)','Derivada de c·xⁿ: o expoente “tomba” multiplicando e diminui 1.',['(c·x^n)′ = c·n·x^(n−1)','(x)′ = 1','√x = x^(1/2) e 1/x^n = x^-n'],['“derive y = 5x⁴” ➜ c = 5, n = 4','“y = 1/x” ➜ y = x^-1','“y = 3x⁻³” ➜ c = 3, n = −3','“raiz de x” ➜ x^(1/2)'],['c = número que multiplica','n = expoente','n − 1 = novo expoente'],['Identifique c e n.','Multiplique c·n.','Subtraia 1 do expoente.','Escreva c·n·x^(n−1).'],'cP',[['y = 5x⁴',{}],['y = 3x⁻³',{c:'3',n:'−3',x:'1'}],['y = √x (c = 1, n = 1/2)',{c:'1',n:'1/2',x:'4'}],['y = x² (c = 1, n = 2)',{c:'1',n:'2',x:'3'}]]),
TP('dv','soma','Derivada da soma e diferença','Derive termo a termo; constante que multiplica sai da frente.',['(u + v + w)′ = u′ + v′ + w′','(k·u)′ = k·u′'],['“derive y = x² + x³” ➜ soma de duas parcelas','“C(q) = 10 + 2q + 0,1q²” ➜ derive cada parcela'],['u, v, w = parcelas','u′, v′, w′ = derivadas das parcelas'],['Separe as parcelas.','Derive cada uma (constante ou potência).','Junte com os mesmos sinais.'],'c3',[['y = x² + x³',{}],['y = 3x⁴ − 2x² + 7x − 9',{f:'3x^4 − 2x^2 + 7x − 9'}],['C(q) = 10 + 2q + 0,1q² em q = 10',{f:'10 + 2x + 0,1x^2',x0:'10'}],['R(x) = −4x² + 500x',{f:'−4x^2 + 500x'}]]),
TP('dv','prod','Derivada do produto','Dois fatores com x: derive um de cada vez e some.',['(u·v)′ = u′·v + u·v′'],['“y = (x + 3)(x − 1)” ➜ u = x + 3, v = x − 1','“receita = preço × quantidade”, com ambos dependendo de x ➜ produto'],['u, v = os dois fatores','u′, v′ = derivadas dos fatores'],['Dê nome aos fatores u e v.','Derive u e v.','Monte u′·v + u·v′.','Expanda e simplifique.'],'c6',[['y = (x + 3)(x − 1)',{}],['y = (2x + 3)(x² − 1)',{u:'2x + 3',v:'x^2 − 1'}],['y = (x² + 1)(x³ − x)',{u:'x^2 + 1',v:'x^3 − x'}],['y = (x + 5)(3x − 2)',{u:'x + 5',v:'3x − 2'}]]),
TP('dv','quoc','Derivada do quociente','Divisão de duas expressões com x.',['(u/v)′ = (u′·v − u·v′) / v²'],['“y = (x + 2)/(x² − 4)” ➜ u = x + 2, v = x² − 4','“custo médio = C(x)/x” ➜ quociente'],['u = numerador, v = denominador','u′, v′ = derivadas'],['Identifique u (cima) e v (baixo).','Derive u e v.','Numerador: u′·v − u·v′.','Denominador: v².','Simplifique se der.'],'c7',[['y = x²/(x + 1)',{}],['y = (x + 1)/(x − 1)',{u:'x + 1',v:'x − 1'}],['y = 3x/(x² + 1)',{u:'3x',v:'x^2 + 1'}],['y = (x + 2)/(x² − 4)',{u:'x + 2',v:'x^2 − 4'}]]),
TP('dv','raiz','Derivada da raiz quadrada','Raiz de uma expressão u(x).',['(√u)′ = u′ / (2√u)'],['“y = √(x + 1)” ➜ u = x + 1','“raiz quadrada de 2x + 1” ➜ u = 2x + 1'],['u = o que está dentro da raiz','u′ = derivada de u'],['Identifique u.','Derive u.','Monte u′/(2√u).'],'cR',[['y = √(x + 1)',{}],['y = √(2x + 1)',{u:'2x + 1'}],['y = √(x² + 9)',{u:'x^2 + 9'}],['y = √(3x − 2)',{u:'3x − 2'}]]),

function gbody(g){const W=340,H=230,m=34,{f,pts,lo,hi,o}=g,cl=o.clip||200,ys=[];(o.f2?[f,o.f2]:[f]).forEach(h=>{for(let i=0;i<=80;i++){const y=h(lo+(hi-lo)*i/80);if(isFinite(y)&&Math.abs(y)<=cl)ys.push(y)}});pts.forEach(p=>{if(p[0]>=lo&&p[0]<=hi)ys.push(p[1])});let a=Math.min(0,...ys),b=Math.max(0,...ys);if(b-a<1e-9)b=a+1;const d=(b-a)*.1;a-=d;b+=d;const X=x=>m+(x-lo)/(hi-lo)*(W-2*m),Y=y=>H-m-(y-a)/(b-a)*(H-2*m),mu='style="stroke:var(--mute)"',tx='style="fill:var(--mute);font-size:9px"';const pa=h=>{let s='',pen=0;for(let i=0;i<=140;i++){const x=lo+(hi-lo)*i/140,y=h(x);if(isFinite(y)&&y>=a&&y<=b){s+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=1}else pen=0}return s};let s='<line x1="'+m+'" x2="'+(W-m)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" '+mu+'/>';const yx=lo<0&&hi>0?X(0):m;s+='<line x1="'+yx+'" x2="'+yx+'" y1="'+m+'" y2="'+(H-m)+'" '+mu+'/><text x="'+(W-m+4)+'" y="'+(Y(0)+4)+'" '+tx+'>x</text><text x="'+(yx+5)+'" y="'+(m-6)+'" '+tx+'>y</text>';const sx=nice((hi-lo)/5);for(let t=Math.ceil(lo/sx)*sx;t<=hi+1e-9;t+=sx){if(Math.abs(t)<1e-9)continue;s+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+(Y(0)-3)+'" y2="'+(Y(0)+3)+'" '+mu+'/><text x="'+X(t)+'" y="'+(Y(0)+13)+'" text-anchor="middle" '+tx+'>'+n(Math.round(t*1e6)/1e6)+'</text>'}const sy=nice((b-a)/4);for(let t=Math.ceil(a/sy)*sy;t<=b+1e-9;t+=sy){if(Math.abs(t)<1e-9)continue;s+='<line x1="'+(yx-3)+'" x2="'+(yx+3)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" '+mu+'/><text x="'+(yx-5)+'" y="'+(Y(t)+3)+'" text-anchor="end" '+tx+'>'+n(Math.round(t*1e6)/1e6)+'</text>'}if(o.area){const[A,B,gg]=o.area;let q='M'+X(A)+' '+Y(gg(A));for(let i=0;i<=40;i++){const x=A+(B-A)*i/40;q+='L'+X(x).toFixed(1)+' '+Y(Math.max(a,Math.min(b,f(x)))).toFixed(1)}s+='<path d="'+q+'L'+X(B)+' '+Y(gg(B))+'Z" style="fill:var(--acc);opacity:.25"/>'}s+='<path d="'+pa(f)+'" style="fill:none;stroke:var(--acc);stroke-width:2.5"/>';if(o.f2)s+='<path d="'+pa(o.f2)+'" style="fill:none;stroke:var(--hi-ink);stroke-width:2;stroke-dasharray:5 4"/>';pts.forEach(p=>{if(p[0]>=lo function drawG(root){root.querySelectorAll('.gr:not([data-ok])').forEach(el=>{const g=GR[el.dataset.g];if(!g)return;el.dataset.ok=1;el.innerHTML='<svg viewBox="0 0 340 230" role="img" aria-label="Gráfico interativo"></svg><div class="gc"><button type="button" data-a="i">＋ Ampliar</button><button type="button" data-a="o">－ Reduzir</button><button type="button" data-a="r">Restaurar</button></div><div class="ro">Arraste para mover; roda ou botões para ampliar; toque ou passe o mouse para ver os valores.</div>'+(g.o.cap?'<p class="lead">'+g.o.cap+'</p>':'');const s=el.querySelector('svg'),ro=el.querySelector('.ro'),rd=()=>{s.innerHTML=gbody(g)};rd();const xv=e=>{const r=s.getBoundingClientRect();return g.lo+((e.clientX-r.left)/r.width*340-34)/(340-68)*(g.hi-g.lo)};const zoom=(k,c)=>{const cx=c===undefined?(g.lo+g.hi)/2:c;g.lo=cx-(cx-g.lo)*k;g.hi=cx+(g.hi-cx)*k;rd()};let dr=null;s.addEventListener('pointerdown',e=>{dr={x:e.clientX,lo:g.lo,hi:g.hi};s.setPointerCapture(e.pointerId)});s.addEventListener('pointermove',e=>{const x=xv(e);if(dr){const r=s.getBoundingClientRect(),dx=(e.clientX-dr.x)/r.width*340/(340-68)*(dr.hi-dr.lo);g.lo=dr.lo-dx;g.hi=dr.hi-dx;rd()}ro.textContent='x = '+n(x)+'  →  f(x) = '+n(g.f(x))+(g.o.f2?'  ;  segunda curva = '+n(g.o.f2(x)):'')});['pointerup','pointercancel'].forEach(t=>s.addEventListener(t,()=>{dr=null}));s.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.85:1.18,xv(e))},{passive:false});el.querySelector('.gc').addEventListener('click',e=>{const a=e.target.dataset.a;if(a=='i')zoom(.7);else if(a=='o')zoom(1.4);else if(a=='r'){g.lo=g.L0;g.hi=g.H0;rd()}})})}

const cAE=v=>{const p=parse(v.f),q=parse(v.g),a=N(v.a),b=N(v.b);if(!p||!q)return BAD;const h=sub(p,q),H=integ(h);if(!H)return err('Termo 1/x: fora desta calculadora.');const A=ev(H,b)-ev(H,a);return ol(['Fórmula: área = ∫ de a até b de [f(x) − g(x)] dx, com f acima de g.','f − g = ('+P(p)+') − ('+P(q)+') = '+P(h),'Primitiva: H(x) = '+P(H),'H('+n(b)+') − H('+n(a)+') = '+n(ev(H,b))+' − '+pr(ev(H,a))+' = '+n(A),A<0?'Resultado negativo: g está acima de f; troque as funções.':'Resultado positivo: f está acima de g no intervalo.'])+res('área = '+n(Math.abs(A)))+graph(t=>ev(p,t),[],...rng([a,b]),{f2:t=>ev(q,t),area:[a,b,t=>ev(q,t)],cap:'Cheia: f(x). Tracejada: g(x). A região sombreada entre elas é a área calculada.'})};

function check(g,txt){try{if(g.kind=='num'){const v=N(txt);return Math.abs(v-g.ans)<=Math.max(.01,Math.abs(g.ans)*.01)}if(g.kind=='set'){const a=txt.split(/;|\be\b|\bou\b|\s+/).filter(Boolean).map(N).sort((x,y)=>x-y),b=[...new Set(g.ans)].sort((x,y)=>x-y);return a.length==b.length&&a.every((v,i)=>Math.abs(v-b[i])<1e-6)}const p=parse(txt);if(!p)return false;return[-2,-1,.5,1,2,3].every(x=>Math.abs(ev(p,x)-ev(g.ans,x))<1e-6*Math.max(1,Math.abs(ev(g.ans,x))))}catch(e){return false}}
function whereErr(g,txt){try{if(g.kind=='num')return'Sua resposta foi '+n(N(txt))+', mas o valor correto é '+n(g.ans)+'.';if(g.kind=='set')return'Suas soluções: '+txt+'. As soluções corretas são: '+[...new Set(g.ans)].map(n).join(' e ')+'.';const p=parse(txt);if(!p)return'Não consegui ler sua resposta. Use o formato 3x^2 − 5x + 7, sem parênteses.';const o=[];new Set([...ks(g.ans),...ks(p)]).forEach(k=>{const a=p[k]||0,b=g.ans[k]||0;if(Math.abs(a-b)>1e-9)o.push('no termo '+(k==0?'sem x':'em x'+(k==1?'':'<sup>'+n(k)+'</sup>'))+' você colocou '+n(a)+' e o correto é '+n(b))});return o.length?'O erro está '+o.join('; ')+'.':''}catch(e){return'Não consegui ler sua resposta.'}}
let EX={lv:0,g:null,t:null};
const HINT={num:'Digite um número (pode usar vírgula ou fração, como 3/4).',set:'Digite as soluções separadas por ponto e vírgula, por exemplo: 2; 3.',poly:'Digite a expressão, por exemplo: 3x^2 − 5x + 7 (sem parênteses).'};
function exNew(){const t=EX.t,el=document.getElementById('exa');if(!GEN[t.k]){el.innerHTML='<p class="lead">Os exercícios deste tópico ainda não foram implementados.</p>';return}EX.g=GEN[t.k](EX.lv);const g=EX.g;el.innerHTML='<div class="row">'+['Básico','Intermediário','Avançado'].map((x,i)=>'<button type="button" class="btn'+(i==EX.lv?'':' alt')+'" data-lv="'+i+'">'+x+'</button>').join('')+'</div><div class="box"><p class="q">'+fmt(g.q)+'</p><p class="lead">'+HINT[g.kind]+'</p><div class="fl"><label class="w">Sua resposta<input id="ans" autocomplete="off"></label></div><button type="button" class="btn" id="chk">Verificar</button><div id="fbk"></div></div>';el.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{EX.lv=+b.dataset.lv;exNew()});const chk=()=>{const v=document.getElementById('ans').value;if(!v.trim())return;const ok=check(g,v),cs=CS[t.k],dv={};cs[2].forEach(f=>dv[f[0]]=f[2]);NOG=true;let st;try{st=cs[3]({...dv,...g.inp})}catch(e){st=''}NOG=false;rec(t.id,ok);document.getElementById('fbk').innerHTML=(ok?'<div class="okb"><b>Correto!</b> A regra aplicada foi: '+fmt(t.f[0])+'. Veja o desenvolvimento para conferir o raciocínio.</div>':'<div class="nok"><b>Ainda não.</b><br>'+whereErr(g,v)+'<br><b>Regra que deveria ser usada ('+t.t+'):</b> '+fmt(t.f[0])+'</div><p><b>Resolução correta, passo a passo:</b></p>')+st+(g.note?'<p class="lead">'+g.note+'</p>':'')+'<button type="button" class="btn" id="nxq">Próxima questão</button>';document.getElementById('nxq').onclick=exNew;document.getElementById('chk').disabled=true;document.getElementById('ans').disabled=true};document.getElementById('chk').onclick=chk;document.getElementById('ans').onkeydown=e=>{if(e.key=='Enter')chk()}}

/* ===== Páginas ===== */
const bc=(...a)=>'<div class="bc"><a href="#">Início</a>'+a.map(x=>' › '+x).join('')+'</div>';
const lst=a=>'<ul class="pl">'+a.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul>';
const tbl=(h,rows)=>'<div style="overflow-x:auto"><table class="tb l"><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
const soon='<p class="lead">O detalhamento desta etapa para este tópico ainda não foi escrito (próxima etapa de desenvolvimento).</p>';
const ETN=['O que é','Identificar','Fórmula','Valores','Regras','Exemplos','Calculadora','Exercícios'];
const ETT=['O que é esse cálculo?','Como identificar no enunciado','Fórmula e significado de cada elemento','Como identificar os valores da questão','Regras, condições e erros comuns','Exemplos resolvidos','Calculadora exclusiva','Exercícios'];
let ET=1;
function etapa(t,i){const E=ENR[t.id]||{},cs=CS[t.k],h=[];ET=i;
if(i==1)h.push('<div class="box"><h3>O que significa</h3>'+fmt(t.o)+'</div>','<div class="box"><h3>Para que serve</h3>'+(E.fin?fmt(E.fin):soon)+'</div>','<div class="box"><h3>Diferença para cálculos parecidos</h3>'+(E.dif?fmt(E.dif):soon)+'</div>');
if(i==2){h.push('<div class="box"><h3>Como costuma aparecer no texto</h3>'+t.tx.map(x=>{const p=x.split(' ➜ ');return'<div class="f"><small>No enunciado: '+fmt(p[0])+'</small><b>Escreva: '+fmt(p[1])+'</b></div>'}).join('')+'</div>');h.push('<div class="box"><h3>Por que cada enunciado indica este cálculo</h3>'+(E.id2?E.id2.map(x=>'<div class="f"><small>'+fmt(x[0])+'</small><b>'+fmt(x[1])+'</b></div>').join(''):soon)+'</div>')}
if(i==3){h.push(t.f.map(x=>'<div class="big">'+fmt(x)+'</div>').join(''));h.push('<div class="box"><h3>Significado de cada elemento</h3>'+(E.el?tbl(['Símbolo','Significa'],E.el):lst(t.v))+'</div>')}
if(i==4){h.push('<div class="box"><h3>Informações que devem ser retiradas</h3>'+(E.vl?tbl(['Informação','Onde aparece','Símbolo','Onde entra na fórmula'],E.vl):lst(t.v))+'</div>','<div class="box"><h3>Método: como organizar os valores e calcular</h3>'+ol(t.p.map(fmt))+'</div>')}
if(i==5)h.push('<div class="box"><h3>Regras e condições de uso</h3>'+(E.rg?lst(E.rg):soon)+'</div>','<div class="box"><h3>Erros mais comuns</h3>'+(E.er?lst(E.er):soon)+'</div>');
if(i==6){const dv={};cs[2].forEach(f=>dv[f[0]]=f[2]);h.push('<p class="lead">Exemplos do mais simples ao mais elaborado. Cada um mostra os valores identificados, a fórmula, a substituição e o desenvolvimento completo.</p>');t.ex.forEach((e,k)=>{const inp={...dv,...e[1]};NOG=true;let r;try{r=cs[3](inp)}catch(x){r=err('Exemplo indisponível.')}NOG=false;h.push('<div class="box"><b>Exemplo '+(k+1)+'</b><p class="q">'+fmt(e[0])+'</p><p class="lead"><b>Tipo de cálculo:</b> '+t.t+'<br><b>Valores identificados:</b> '+cs[2].map(f=>f[1]+' = '+(inp[f[0]].trim()||'—')).join(' ; ')+'<br><b>Fórmula utilizada:</b> '+fmt(t.f[0])+'</p>'+r+'<p class="lead"><b>Como chegamos ao resultado:</b> seguimos o método “'+fmt(t.p.join(' → '))+'”.</p></div>')})}
if(i==8)h.push('<div id="exa"></div>');
document.getElementById('et').innerHTML='<h3 style="font-size:1.2rem">'+i+'. '+ETT[i-1]+'</h3>'+h.join('');
if(i==7){const c=card(...cs,t.f.join(' ; '));document.getElementById('et').appendChild(c)}
if(i==8){EX.t=t;EX.g=null;exNew()}
document.querySelectorAll('#stp button').forEach(b=>b.setAttribute('aria-current',+b.dataset.e==i));
document.getElementById('pn').innerHTML=(i>1?'<button type="button" class="btn alt" id="pe">◀ Etapa anterior</button>':'<span style="flex:1"></span>')+(i<8?'<button type="button" class="btn" id="ne">Próxima etapa ▶</button>':(nextOf(t.id)?'<a class="btn" href="#'+nextOf(t.id)+'">Próximo tópico ▶</a>':''));
const pe=document.getElementById('pe'),ne=document.getElementById('ne');if(pe)pe.onclick=()=>{etapa(t,i-1);scrollTo(0,0)};if(ne)ne.onclick=()=>{etapa(t,i+1);scrollTo(0,0)}}
const nextOf=id=>{const k=FLAT.indexOf(id);return FLAT[k+1]};
function topic(t){const P0=TPOS[t.id];if(!stOf(t.id))setSt(t.id,1);main.innerHTML=bc('<a href="#'+P0.m.id+'">Módulo '+P0.m.n+'</a>',P0.m.a.length>1?'<a href="#'+P0.a.id+'">'+P0.a.t+'</a>':'',t.t).replace(' › ›',' ›')+'<h2>'+t.t+(ADD.has(t.id)?' <span class="pill">Conteúdo adicional</span>':'')+'</h2><div class="row"><label>Status do estudo<select id="st"><option value="0">Não iniciado</option><option value="1">Em andamento</option><option value="2">Concluído</option></select></label></div><div class="stp" id="stp">'+ETN.map((x,i)=>'<button type="button" data-e="'+(i+1)+'">'+(i+1)+'. '+x+'</button>').join('')+'</div><div id="et"></div><div class="pn" id="pn"></div>';const sel=document.getElementById('st');sel.value=stOf(t.id);sel.onchange=()=>setSt(t.id,+sel.value);document.querySelectorAll('#stp button').forEach(b=>b.onclick=()=>{etapa(t,+b.dataset.e)});etapa(t,1)}
const lnk=(i,k)=>TM[i]?'<a class="cat" href="#'+i+'"><span class="n">'+k+'</span><span><b>'+TM[i].t+(ADD.has(i)?' <em class="pill">adicional</em>':'')+'</b><small>'+['Não iniciado','Em andamento','Concluído'][stOf(i)]+' · '+fmt(TM[i].o)+'</small></span></a>':'<a class="cat" href="#'+i+'" style="opacity:.6"><span class="n">'+k+'</span><span><b>'+PLAN[i]+' <em class="pill">em breve</em></b></span></a>';
function home(){let tot=0,dn=0;MODS.forEach(m=>{tot+=m.ids.length;dn+=m.ids.filter(i=>stOf(i)==2).length});main.innerHTML='<h2>Matéria: Cálculo</h2><p class="lead">Escolha um módulo, depois um assunto e um tópico. Cada tópico tem 8 etapas: o que é, como identificar no enunciado, fórmula, valores, regras e erros, exemplos, calculadora com gráfico e exercícios. Os tópicos marcados como “adicional” ampliam o material das aulas. O progresso fica salvo neste navegador.</p><div class="box"><b>Progresso geral: '+Math.round(100*dn/tot)+'%</b><div class="bar"><i style="width:'+Math.round(100*dn/tot)+'%"></i></div><div class="row"><a class="btn" href="#qual">Qual fórmula devo utilizar?</a><a class="btn alt" href="#revisar">Revisar conteúdos</a></div></div>'+MODS.map(m=>'<a class="cat" href="#'+m.id+'"><span class="n">'+m.n+'</span><span><b>'+m.t+'</b><small>'+m.d+' · '+m.ids.length+' tópicos prontos'+(m.a.some(a=>a.items.some(i=>!TM[i]))?' · outros em breve':'')+'</small><div class="bar"><i style="width:'+pct(m)+'%"></i></div></span></a>').join('')}
function modPage(m){let h=bc('Módulo '+m.n)+'<h2>Módulo '+m.n+' – '+m.t+'</h2><p class="lead">'+m.d+'</p><div class="bar"><i style="width:'+pct(m)+'%"></i></div><div style="height:12px"></div>';if(m.a.length==1)h+=m.a[0].items.map((i,k)=>lnk(i,k+1)).join('');else h+=m.a.map((a,k)=>'<a class="cat" href="#'+a.id+'"><span class="n">'+(k+1)+'</span><span><b>'+a.t+'</b><small>'+a.items.length+' tópicos</small></span></a>').join('');main.innerHTML=h}
function asnPage(o){main.innerHTML=bc('<a href="#'+o.m.id+'">Módulo '+o.m.n+'</a>',o.a.t)+'<h2>'+o.a.t+'</h2><p class="lead">Estude na ordem numerada.</p>'+o.a.items.map((i,k)=>lnk(i,k+1)).join('')}
function planPage(id){const o=TPOS[id];main.innerHTML=bc('<a href="#'+o.m.id+'">Módulo '+o.m.n+'</a>',PLAN[id])+'<h2>'+PLAN[id]+'</h2><div class="box"><span class="pill">Em breve</span><p>Este tópico faz parte do conteúdo programático e será implementado nas próximas etapas, com as mesmas 8 etapas dos demais (o que é, identificação no enunciado, fórmula, valores, regras, exemplos, calculadora e exercícios).</p><a class="btn alt" href="#'+o.m.id+'">Voltar ao módulo</a></div>'}
function revisar(){const L=Object.keys(PG).filter(i=>TM[i]&&PG[i].tot>0&&PG[i].ok<PG[i].tot).sort((a,b)=>(PG[b].tot-PG[b].ok)-(PG[a].tot-PG[a].ok));main.innerHTML=bc('Revisar conteúdos')+'<h2>Revisar conteúdos</h2><p class="lead">Tópicos em que você mais errou, do maior para o menor número de erros.</p>'+(L.length?L.map((i,k)=>'<a class="cat" href="#'+i+'"><span class="n">'+(k+1)+'</span><span><b>'+TM[i].t+'</b><small>'+(PG[i].tot-PG[i].ok)+' erro(s) em '+PG[i].tot+' questão(ões) · acertos: '+Math.round(100*PG[i].ok/PG[i].tot)+'%</small></span></a>').join(''):'<div class="box">Nenhum erro registrado ainda. Faça exercícios nos tópicos ou o treino “Qual fórmula devo utilizar?”.</div>')}

/* ===== Qual fórmula devo utilizar ===== */
const M={eq1:'Equação do 1º grau',afim:'Função afim por 2 pontos',bhask:'Bhaskara (raízes)',vert:'Vértice da parábola',der:'Derivada (soma/potência)',prod:'Regra do produto',quoc:'Regra do quociente',pot:'Regra da potência',cad:'Regra da cadeia (u^r)',raiz:'Derivada da raiz',expl:'Derivada de e^u',tang:'Reta tangente',intind:'Integral indefinida',intdef:'Integral definida',lim:'Limite (fatorar 0/0)',exp:'Equação exponencial (log)'};
const MT={eq1:'e1-simples',afim:'f1-pontos',bhask:'e2-bhaskara',vert:'f2-vertice',der:'dv-soma',prod:'dv-prod',quoc:'dv-quoc',pot:'dv-pot',cad:'dv-cadeia',raiz:'dv-raiz',expl:'dv-exp',tang:'dv-tang',intind:'it-soma',intdef:'it-def',lim:'lm-zero',exp:'ex-log'};
const Q=[
['O custo mensal é C = 5.000 + 15x. Qual a quantidade produzida se o custo foi R$ 8.000?','eq1','Valor final dado e quantidade pedida: 5000 + 15x = 8000 → x = 200.','fixo b = 5.000; por unidade a = 15; total = 8.000; incógnita x = quantidade.'],
['Em L(x) = −2x² + 16x − 20, qual preço dá o maior lucro? Use a fórmula do pico da parábola.','vert','xᵥ = −b/2a = 4.','a = −2, b = 16, c = −20; pede xᵥ.'],
['Quantas caixas dão lucro zero em L(x) = −x² + 20x − 36?','bhask','Lucro zero é achar as raízes: Δ = 256, x = 2 ou 18.','a = −1, b = 20, c = −36; condição L(x) = 0.'],
['Dada R(x) = −4x² + 500x, obtenha a receita marginal.','der','Marginal pede a derivada: R′ = −8x + 500.','R(x) = −4x² + 500x; “marginal” → R′(x).'],
['Derive y = (x + 3)(x − 1).','prod','Dois fatores com x: y′ = u′v + uv′ = 2x + 2.','u = x + 3, v = x − 1.'],
['Derive y = (x + 2)/(x² − 4).','quoc','Divisão com x embaixo: (u′v − uv′)/v².','u = x + 2, v = x² − 4.'],
['Derive y = 3x⁻³.','pot','Regra do tombo: 3·(−3)x⁻⁴ = −9x⁻⁴.','c = 3, n = −3.'],
['Derive y = (3x + 1)⁵.','cad','Expressão elevada a r: r·u^(r−1)·u′ = 15(3x + 1)⁴.','u = 3x + 1, r = 5, u′ = 3.'],
['Derive y = √(x + 1).','raiz','(√u)′ = u′/(2√u) = 1/(2√(x + 1)).','u = x + 1, u′ = 1.'],
['Derive y = e^(5x).','expl','(e^u)′ = u′·e^u = 5e^(5x).','u = 5x, u′ = 5.'],
['Ache a equação da reta tangente a y = x² em x = 1.','tang','m = f′(1) = 2 e f(1) = 1: y = 2x − 1.','f(x) = x², x₀ = 1; m = f′(1).'],
['O gráfico é uma reta que passa por (0; 3) e (4; 0). Obtenha a função.','afim','a = (0 − 3)/(4 − 0) = −3/4 e b = 3.','pontos (0; 3) e (4; 0).'],
['O custo marginal é C′(q) = 3q² − 10q + 20 e o custo fixo é 50. Encontre C(q).','intind','Do marginal ao total: integre; K vem do custo fixo.','Cmg = 3q² − 10q + 20; C(0) = 50.'],
['Dada p(q) = 100 − 4q e q₀ = 10, determine o excedente do consumidor.','intdef','Há limites (0 a 10): integral definida de [p(q) − p₀].','p(q) = 100 − 4q; q₀ = 10; p₀ = 60; limites 0 e 10.'],
['Calcule o limite de (x² − 4)/(x − 2) quando x tende a 2.','lim','Dá 0/0: fatore e simplifique; o limite é 4.','p(x) = x² − 4; q(x) = x − 2; a = 2.'],
['Resolva 2^x = 32.','exp','x no expoente: iguale as bases (2^5) ou use logaritmo; x = 5.','base 2; c = 32; incógnita no expoente.'],
['O comprimento de um terreno tem 40 m a mais que a largura e a área é 1.200 m². Quais as dimensões?','bhask','x(x + 40) = 1200 → x² + 40x − 1200 = 0; x = 20.','x = largura; x + 40 = comprimento; área = 1.200.']
];
const CL=[['“qual a quantidade”, com valor final dado','Equação do 1º grau'],['dois pontos de uma reta','Função afim: a = Δy/Δx'],['“marginal”','Derivada'],['“maior lucro”, “máximo”, “mínimo”','Vértice ou L′ = 0'],['“lucro zero”, “equilíbrio”, raízes','Bhaskara'],['produto de dois fatores com x','Regra do produto'],['divisão com x embaixo','Regra do quociente'],['expressão entre parênteses elevada a um número','Regra da cadeia'],['“custo total” a partir do marginal','Integral indefinida + custo fixo'],['“de a até b”, “área”, “excedente”','Integral definida'],['0/0 em um limite','Fatorar e simplificar'],['x no expoente','Igualar bases ou logaritmo']];
let sc=0,tot=0,qi=-1;
function quiz(){const box=document.getElementById('qz');let i;do{i=Math.floor(Math.random()*Q.length)}while(i===qi);qi=i;const q=Q[i],o=[q[1],...Object.keys(M).filter(k=>k!==q[1]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);box.innerHTML='<p class="q">'+fmt(q[0])+'</p><p class="lead">Qual método resolve esta questão?</p>'+o.map(k=>'<button type="button" class="opt" data-k="'+k+'">'+M[k]+'</button>').join('')+'<div id="fb"></div>';box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.k===q[1])x.classList.add('ok')});const ok=b.dataset.k===q[1];if(!ok)b.classList.add('bad');tot++;if(ok)sc++;rec(MT[q[1]],ok);const tp=TM[MT[q[1]]],mo=TPOS[tp.id].m;document.getElementById('sc').textContent='Acertos: '+sc+' de '+tot;document.getElementById('fb').innerHTML='<div class="'+(ok?'okb':'nok')+'"><b>'+(ok?'Certo. ':'Era: '+M[q[1]]+'. ')+'</b>'+fmt(q[2])+'<br><b>Assunto:</b> Módulo '+mo.n+' – '+mo.t+' · '+tp.t+'<br><b>Valores a retirar do enunciado:</b> '+fmt(q[3])+'</div><div class="row"><button type="button" class="btn" id="nx">Próxima pergunta</button><a class="btn alt" href="#'+tp.id+'">Estudar este conteúdo</a></div>';document.getElementById('nx').onclick=quiz})}
function qual(){main.innerHTML=bc('Qual fórmula devo utilizar?')+'<h2>Qual fórmula devo utilizar?</h2><p class="lead">Para cada enunciado, identifique o método. Depois do resultado você vê o assunto e os valores que deveriam ser retirados do texto. <span id="sc">Acertos: 0 de 0</span></p><div class="box" id="qz"></div><h3>Pistas de enunciado</h3>'+CL.map(x=>'<div class="f"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('');sc=0;tot=0;qi=-1;quiz()}

function show(){const h=location.hash.slice(1);if(TM[h])topic(TM[h]);else if(PLAN[h])planPage(h);else if(h=='qual')qual();else if(h=='revisar')revisar();else if(AM[h])asnPage(AM[h]);else if(MM[h])modPage(MM[h]);else home();refresh()}
